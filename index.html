<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>MiniMax 文生图 - 本地测试</title>
    <!-- JSZip：用于把多张图片打包成 zip 一次下载 -->
    <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>

    <style>
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      html, body {
        margin: 0;
        padding: 0;
        background: #f5f5f7;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Hiragino Sans GB", "Microsoft YaHei", Arial, sans-serif;
        color: #222;
        -webkit-font-smoothing: antialiased;
        overscroll-behavior-y: contain;
      }
      body {
        min-height: 100vh;
        min-height: 100dvh;
      }
      h2 { margin: 0 0 8px 0; font-size: 20px; }
      h3 { margin: 0 0 12px 0; font-size: 16px; }

      /* ========== 桌面端：左右两栏 ========== */
      .app {
        display: flex;
        max-width: 1400px;
        margin: 0 auto;
        min-height: 100vh;
        min-height: 100dvh;
      }
      .main {
        flex: 1;
        padding: 20px 24px;
        min-width: 0;
      }
      .sidebar {
        width: 320px;
        flex-shrink: 0;
        background: #fff;
        border-left: 1px solid #e0e0e0;
        padding: 20px 16px;
        overflow-y: auto;
        max-height: 100vh;
        max-height: 100dvh;
        position: sticky;
        top: 0;
      }

      /* ========== 移动端 Tab 切换（默认隐藏） ========== */
      .tab-bar {
        display: none;
        position: sticky;
        top: 0;
        z-index: 10;
        background: #fff;
        border-bottom: 1px solid #e0e0e0;
      }
      .tab-btn {
        flex: 1;
        padding: 14px 0;
        font-size: 15px;
        font-weight: 500;
        background: #fff;
        color: #666;
        border: none;
        border-bottom: 3px solid transparent;
        cursor: pointer;
        transition: color 0.15s, border-color 0.15s;
      }
      .tab-btn.active {
        color: #1976d2;
        border-bottom-color: #1976d2;
      }
      .tab-btn .badge {
        display: inline-block;
        min-width: 20px;
        padding: 1px 6px;
        margin-left: 4px;
        background: #e3f2fd;
        color: #1976d2;
        font-size: 11px;
        font-weight: 600;
        border-radius: 10px;
        vertical-align: middle;
      }

      /* ========== 表单元素 ========== */
      input, button, textarea {
        font-family: inherit;
        font-size: 15px;
      }
      input, textarea {
        padding: 10px 12px;
        border: 1px solid #ccc;
        border-radius: 8px;
        outline: none;
        width: 100%;
        margin: 6px 0;
        background: #fff;
        -webkit-appearance: none;
        appearance: none;
      }
      input:focus, textarea:focus {
        border-color: #1976d2;
        box-shadow: 0 0 0 3px rgba(25, 118, 210, 0.1);
      }
      button {
        padding: 12px 18px;
        font-size: 15px;
        background: #1976d2;
        color: #fff;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        min-height: 44px; /* 触摸友好 */
        transition: background 0.15s, transform 0.05s;
      }
      button:active { transform: scale(0.98); }
      button:hover { background: #1565c0; }
      button:disabled {
        background: #999;
        cursor: not-allowed;
        transform: none;
      }
      .btn-row {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-top: 8px;
      }
      .btn-secondary {
        background: #f0f0f0;
        color: #333;
        border: 1px solid #ccc;
        padding: 10px 14px;
        font-size: 14px;
        border-radius: 8px;
        cursor: pointer;
        min-height: 44px;
      }
      .btn-secondary:hover { background: #e0e0e0; }
      .btn-secondary:active { transform: scale(0.98); }

      .field { margin-bottom: 14px; }
      .field label {
        display: block;
        font-weight: 600;
        font-size: 14px;
        color: #333;
        margin-bottom: 4px;
      }
      .key-status {
        font-size: 12px;
        color: #2e7d32;
        margin-left: 4px;
        font-weight: normal;
      }
      .key-status.empty { color: #c62828; }

      /* ========== 警告条 ========== */
      .warning {
        color: #d32f2f;
        font-weight: 500;
        background: #fff3e0;
        padding: 10px 12px;
        border-radius: 8px;
        border-left: 4px solid #d32f2f;
        font-size: 13px;
        line-height: 1.5;
        margin-bottom: 16px;
      }
      .error {
        color: #c62828;
        white-space: pre-wrap;
        word-break: break-all;
        background: #ffebee;
        padding: 12px;
        border-radius: 8px;
        font-size: 14px;
        line-height: 1.5;
      }
      .loading {
        color: #555;
        background: #fff8e1;
        padding: 12px;
        border-radius: 8px;
        font-size: 14px;
        text-align: center;
      }

      /* ========== 结果区 ========== */
      #result { margin-top: 16px; }
      .result-img {
        max-width: 100%;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        display: block;
        margin-bottom: 12px;
        background: #fff;
        cursor: zoom-in;
        width: 100%;
        height: auto;
      }
      .result-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 8px;
      }
      .result-grid .result-img { margin-bottom: 0; }
      .history-banner {
        background: #e3f2fd;
        color: #0d47a1;
        padding: 10px 14px;
        border-radius: 8px;
        font-size: 13px;
        margin-bottom: 12px;
        border-left: 4px solid #1976d2;
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 8px;
      }
      .history-banner button {
        background: transparent;
        color: #1976d2;
        border: 1px solid #1976d2;
        padding: 4px 10px;
        font-size: 12px;
        border-radius: 4px;
        min-height: auto;
        cursor: pointer;
      }
      .history-banner button:hover { background: #1976d2; color: #fff; }

      /* ========== 侧边栏 / 历史 ========== */
      .sidebar-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 12px;
      }
      .sidebar-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-bottom: 12px;
      }
      .sidebar-actions button {
        flex: 1 1 calc(50% - 3px);
        min-width: 0;
        padding: 8px 6px;
        font-size: 12px;
        background: #fff;
        color: #555;
        border: 1px solid #ccc;
        min-height: 36px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .sidebar-actions button:hover {
        background: #f5f5f5;
        color: #c62828;
        border-color: #c62828;
      }
      .sidebar-actions button:disabled {
        background: #f5f5f5;
        color: #999;
        border-color: #ddd;
        cursor: not-allowed;
      }
      .history-list {
        list-style: none;
        padding: 0;
        margin: 0;
      }
      .history-item {
        background: #fafafa;
        border: 1px solid #e0e0e0;
        border-radius: 8px;
        padding: 10px;
        margin-bottom: 8px;
        cursor: pointer;
        transition: all 0.15s;
        position: relative;
      }
      .history-item:hover, .history-item:focus {
        background: #e3f2fd;
        border-color: #1976d2;
        outline: none;
      }
      .history-prompt {
        font-size: 13px;
        color: #333;
        line-height: 1.4;
        display: -webkit-box;
        -webkit-line-clamp: 3;
        line-clamp: 3;
        -webkit-box-orient: vertical;
        overflow: hidden;
        word-break: break-all;
        margin-bottom: 6px;
        padding-right: 24px;
      }
      .history-meta {
        font-size: 11px;
        color: #888;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .history-thumbs {
        display: flex;
        gap: 4px;
        margin-top: 8px;
        overflow-x: auto;
        overflow-y: hidden;
        -webkit-overflow-scrolling: touch;
        padding-bottom: 4px;
        scrollbar-width: thin;
      }
      .history-thumbs::-webkit-scrollbar { height: 4px; }
      .history-thumbs::-webkit-scrollbar-thumb { background: #ccc; border-radius: 2px; }
      .history-thumbs img {
        width: 64px;
        height: 64px;
        min-width: 64px;
        object-fit: cover;
        border-radius: 4px;
        background: #eee;
        cursor: zoom-in;
        border: 1px solid #ddd;
        flex-shrink: 0;
      }
      .history-thumbs img:hover { border-color: #1976d2; }
      .history-delete {
        position: absolute;
        top: 6px;
        right: 6px;
        background: transparent;
        color: #999;
        border: none;
        cursor: pointer;
        font-size: 18px;
        padding: 4px 8px;
        line-height: 1;
        min-height: auto;
        border-radius: 4px;
      }
      .history-delete:hover { color: #c62828; background: rgba(198,40,40,0.08); }
      .empty-tip {
        text-align: center;
        color: #999;
        font-size: 13px;
        padding: 24px 0;
      }

      /* ========== 图片灯箱 ========== */
      .lightbox {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.92);
        z-index: 9999;
        align-items: center;
        justify-content: center;
        padding: 16px;
        touch-action: none; /* 防止触摸滚动 */
      }
      .lightbox.active { display: flex; }
      .lightbox-img-wrap {
        position: relative;
        max-width: 100%;
        max-height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        user-select: none;
        -webkit-user-drag: none;
      }
      .lightbox img {
        max-width: 100%;
        max-height: calc(100vh - 80px);
        max-height: calc(100dvh - 80px);
        object-fit: contain;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        border-radius: 4px;
        display: block;
        transition: opacity 0.15s;
        pointer-events: none; /* 防止图片被拖拽 */
      }
      .lightbox img.loading { opacity: 0.3; }
      .lightbox-close {
        position: absolute;
        top: 12px;
        right: 12px;
        background: rgba(255, 255, 255, 0.15);
        color: #fff;
        border: none;
        width: 40px;
        height: 40px;
        border-radius: 50%;
        font-size: 22px;
        line-height: 1;
        cursor: pointer;
        z-index: 10000;
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
      }
      .lightbox-close:hover { background: rgba(255, 255, 255, 0.3); }
      .lightbox-nav {
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        background: rgba(255, 255, 255, 0.15);
        color: #fff;
        border: none;
        width: 48px;
        height: 48px;
        border-radius: 50%;
        font-size: 24px;
        line-height: 1;
        cursor: pointer;
        z-index: 10000;
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        display: flex;
        align-items: center;
        justify-content: center;
        transition: background 0.15s, transform 0.1s;
      }
      .lightbox-nav:hover { background: rgba(255, 255, 255, 0.3); }
      .lightbox-nav:active { transform: translateY(-50%) scale(0.92); }
      .lightbox-nav:disabled {
        opacity: 0.3;
        cursor: not-allowed;
        background: rgba(255, 255, 255, 0.1);
      }
      .lightbox-nav.prev { left: 12px; }
      .lightbox-nav.next { right: 12px; }
      .lightbox-counter {
        position: absolute;
        top: 16px;
        left: 50%;
        transform: translateX(-50%);
        color: #fff;
        background: rgba(0, 0, 0, 0.5);
        padding: 6px 14px;
        border-radius: 20px;
        font-size: 13px;
        font-variant-numeric: tabular-nums;
        z-index: 10000;
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
      }
      .lightbox-hint {
        position: absolute;
        bottom: 16px;
        left: 50%;
        transform: translateX(-50%);
        color: rgba(255, 255, 255, 0.6);
        font-size: 12px;
        z-index: 10000;
        text-align: center;
        pointer-events: none;
      }
      @media (max-width: 768px) {
        .lightbox-nav { width: 40px; height: 40px; font-size: 20px; }
        .lightbox-nav.prev { left: 8px; }
        .lightbox-nav.next { right: 8px; }
        .lightbox-hint { display: none; } /* 移动端隐藏文字提示，省屏 */
      }

      /* ========== 移动端适配 ========== */
      @media (max-width: 768px) {
        h2 { font-size: 18px; }
        .app {
          flex-direction: column;
          max-width: 100%;
        }
        .tab-bar {
          display: flex;
        }
        .main {
          padding: 12px 14px 24px;
        }
        .main.hidden-mobile { display: none; }
        .sidebar {
          width: 100%;
          max-width: 100%;
          max-height: none;
          border-left: none;
          border-top: 1px solid #e0e0e0;
          padding: 14px;
          position: static;
          display: none;
        }
        .sidebar.active-mobile { display: block; }
        .sidebar-header { margin-bottom: 10px; }
        .history-thumbs img { width: 72px; height: 72px; min-width: 72px; }
        .warning { font-size: 12px; padding: 8px 10px; }
        .btn-row .btn-secondary { flex: 1; min-width: 0; }
        /* 移动端按钮稍小 */
        button { padding: 11px 16px; }
        .btn-secondary { padding: 10px 12px; }
      }
      @media (max-width: 380px) {
        .main { padding: 10px 10px 20px; }
        h2 { font-size: 17px; }
        .history-thumbs img { width: 64px; height: 64px; min-width: 64px; }
      }

      /* 防止 iOS 输入框聚焦时页面被顶上 */
      @supports (-webkit-touch-callout: none) {
        .main { padding-bottom: env(safe-area-inset-bottom); }
      }
    </style>
  </head>
  <body>
    <!-- 移动端 Tab 栏（≥769px 隐藏） -->
    <div class="tab-bar" role="tablist">
      <button class="tab-btn active" data-tab="main" role="tab" aria-selected="true">
        ✏️ 生成
      </button>
      <button class="tab-btn" data-tab="history" role="tab" aria-selected="false">
        📜 历史 <span id="tabBadge" class="badge" style="display:none">0</span>
      </button>
    </div>

    <div class="app">
      <!-- 左侧/默认：主操作区 -->
      <div class="main" id="mainPanel">
        <h2>🎨 MiniMax 文生图</h2>
        <div class="warning">
          ⚠️ 警告：API Key 会暴露在前端，仅限本地测试使用，切勿用于生产环境！
        </div>

        <div class="field">
          <label>
            🔑 API Key
            <span id="keyStatus" class="key-status empty">（未缓存）</span>
          </label>
          <input
            id="apiKeyInput"
            type="password"
            placeholder="请输入你的 API Key (自动缓存到 localStorage)"
            autocomplete="off"
            spellcheck="false"
          />
          <div class="btn-row">
            <button class="btn-secondary" id="saveKeyBtn">💾 保存 Key</button>
            <button class="btn-secondary" id="toggleKeyBtn">👁️ 显示</button>
            <button class="btn-secondary" id="clearKeyBtn">🗑️ 清除</button>
          </div>
        </div>

        <div class="field">
          <label>📝 图片描述 (Prompt):</label>
          <input
            id="promptInput"
            type="text"
            value="一只可爱的柴犬戴着墨镜，在海滩上奔跑，电影质感"
            placeholder="输入提示词，回车或点击生成"
            enterkeyhint="send"
          />
        </div>

        <div class="btn-row">
          <button id="generateBtn" style="flex:1; min-width: 140px;">🚀 生成图片</button>
          <button class="btn-secondary" id="clearCacheBtn">🗑️ 全部清除</button>
        </div>

        <div id="result"></div>
      </div>

      <!-- 右侧/移动端 Tab：历史侧边栏 -->
      <aside class="sidebar" id="historyPanel" role="tabpanel" aria-label="历史提示词">
        <div class="sidebar-header">
          <h3>📜 历史提示词 <span id="historyCount" style="color:#888;font-weight:normal;font-size:13px">(0)</span></h3>
        </div>
        <div class="sidebar-actions">
          <button id="exportHistoryBtn">📥 导出</button>
          <button id="downloadAllBtn">📦 下载全部图片</button>
          <button id="clearHistoryBtn">🗑️ 清空</button>
        </div>
        <ul id="historyList" class="history-list"></ul>
        <div id="emptyTip" class="empty-tip">暂无历史，生成后会自动保存</div>
      </aside>
    </div>

    <!-- 图片灯箱 -->
    <div id="lightbox" class="lightbox" role="dialog" aria-modal="true" aria-label="图片预览">
      <button class="lightbox-close" id="lightboxClose" aria-label="关闭">×</button>
      <div class="lightbox-counter" id="lightboxCounter">1 / 1</div>
      <button class="lightbox-nav prev" id="lightboxPrev" aria-label="上一张">‹</button>
      <div class="lightbox-img-wrap" id="lightboxWrap">
        <img id="lightboxImg" src="" alt="预览" />
      </div>
      <button class="lightbox-nav next" id="lightboxNext" aria-label="下一张">›</button>
      <div class="lightbox-hint" id="lightboxHint">← → 切换 · Esc 关闭 · 移动端可滑动</div>
    </div>

    <script>
      (function () {
        const API_URL = "https://api.minimaxi.com/v1/image_generation";
        const LS_KEY_API = "minimax_api_key";
        const LS_KEY_HISTORY = "minimax_prompt_history";
        const LS_KEY_LAST = "minimax_last_prompt";
        const LS_KEY_TAB = "minimax_active_tab";
        const HISTORY_MAX = 50;

        // ========== localStorage 封装 ==========
        const storage = {
          get(key, fallback = null) {
            try {
              const v = localStorage.getItem(key);
              return v === null ? fallback : v;
            } catch (e) { return fallback; }
          },
          set(key, value) {
            try { localStorage.setItem(key, value); return true; }
            catch (e) { return false; }
          },
          remove(key) {
            try { localStorage.removeItem(key); return true; }
            catch (e) { return false; }
          },
        };

        // ========== DOM ==========
        const generateBtn = document.getElementById("generateBtn");
        const resultDiv = document.getElementById("result");
        const apiKeyInput = document.getElementById("apiKeyInput");
        const promptInput = document.getElementById("promptInput");
        const saveKeyBtn = document.getElementById("saveKeyBtn");
        const clearKeyBtn = document.getElementById("clearKeyBtn");
        const toggleKeyBtn = document.getElementById("toggleKeyBtn");
        const clearCacheBtn = document.getElementById("clearCacheBtn");
        const historyList = document.getElementById("historyList");
        const historyCount = document.getElementById("historyCount");
        const emptyTip = document.getElementById("emptyTip");
        const downloadAllBtn = document.getElementById("downloadAllBtn");
        const clearHistoryBtn = document.getElementById("clearHistoryBtn");
        const exportHistoryBtn = document.getElementById("exportHistoryBtn");
        const keyStatus = document.getElementById("keyStatus");
        const lightbox = document.getElementById("lightbox");
        const lightboxImg = document.getElementById("lightboxImg");
        const lightboxClose = document.getElementById("lightboxClose");
        const lightboxPrev = document.getElementById("lightboxPrev");
        const lightboxNext = document.getElementById("lightboxNext");
        const lightboxCounter = document.getElementById("lightboxCounter");
        const lightboxHint = document.getElementById("lightboxHint");
        const mainPanel = document.getElementById("mainPanel");
        const historyPanel = document.getElementById("historyPanel");
        const tabBadge = document.getElementById("tabBadge");
        const tabBtns = document.querySelectorAll(".tab-btn");

        // ========== 工具函数 ==========
        function isMobile() {
          return window.matchMedia("(max-width: 768px)").matches;
        }
        function escapeHtml(s) {
          return String(s)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#39;");
        }
        function formatTime(ts) {
          const d = new Date(ts);
          const pad = (n) => String(n).padStart(2, "0");
          const now = new Date();
          const isToday = d.toDateString() === now.toDateString();
          if (isToday) return `今天 ${pad(d.getHours())}:${pad(d.getMinutes())}`;
          return `${d.getMonth() + 1}/${d.getDate()} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
        }

        // ========== 移动端 Tab 切换 ==========
        function switchTab(tab) {
          tabBtns.forEach((b) => {
            const active = b.dataset.tab === tab;
            b.classList.toggle("active", active);
            b.setAttribute("aria-selected", active ? "true" : "false");
          });
          if (tab === "main") {
            mainPanel.classList.remove("hidden-mobile");
            historyPanel.classList.remove("active-mobile");
          } else {
            mainPanel.classList.add("hidden-mobile");
            historyPanel.classList.add("active-mobile");
            // 切到历史时回到顶部
            historyPanel.scrollTop = 0;
            window.scrollTo({ top: 0, behavior: "smooth" });
          }
          storage.set(LS_KEY_TAB, tab);
        }
        tabBtns.forEach((b) => {
          b.addEventListener("click", () => switchTab(b.dataset.tab));
        });
        // 桌面端 Tab 按钮也响应（虽然隐藏，但保留逻辑一致性）
        // 切回桌面端时确保主面板可见
        window.matchMedia("(max-width: 768px)").addEventListener("change", (e) => {
          if (!e.matches) {
            mainPanel.classList.remove("hidden-mobile");
            historyPanel.classList.remove("active-mobile");
            tabBtns.forEach((b) => {
              const active = b.dataset.tab === "main";
              b.classList.toggle("active", active);
              b.setAttribute("aria-selected", active ? "true" : "false");
            });
          } else {
            // 切回移动端，根据保存的 tab 恢复
            const saved = storage.get(LS_KEY_TAB, "main");
            switchTab(saved);
          }
        });

        // ========== 历史管理 ==========
        function loadHistory() {
          try {
            const raw = storage.get(LS_KEY_HISTORY, "[]");
            const arr = JSON.parse(raw);
            return Array.isArray(arr) ? arr : [];
          } catch (e) { return []; }
        }
        function saveHistory(list) {
          storage.set(LS_KEY_HISTORY, JSON.stringify(list));
        }
        function addHistory(prompt, imageUrls) {
          const list = loadHistory();
          const existingIdx = list.findIndex((h) => h.prompt === prompt);
          const now = Date.now();
          let entry;
          if (existingIdx >= 0) {
            entry = list[existingIdx];
            entry.timestamp = now;
            const set = new Set([...(entry.urls || []), ...imageUrls]);
            entry.urls = Array.from(set);
            list.splice(existingIdx, 1);
          } else {
            entry = { prompt, urls: imageUrls, timestamp: now };
          }
          list.unshift(entry);
          if (list.length > HISTORY_MAX) list.length = HISTORY_MAX;
          saveHistory(list);
          renderHistory();
        }
        function removeHistory(timestamp) {
          const entry = loadHistory().find((h) => h.timestamp === timestamp);
          if (!entry) return;
          // 二次确认：显示 prompt 前 30 字
          const preview = entry.prompt.length > 30
            ? entry.prompt.slice(0, 30) + "…"
            : entry.prompt;
          const urlCount = (entry.urls || []).length;
          if (!confirm(`确定删除这条历史吗？\n\n提示词：${preview}\n图片：${urlCount} 张\n\n此操作不可恢复。`)) {
            return;
          }
          const list = loadHistory().filter((h) => h.timestamp !== timestamp);
          saveHistory(list);
          renderHistory();
          flashMessage("已删除 1 条历史");
        }
        function clearHistory() {
          if (!confirm("确定清空所有历史提示词吗？")) return;
          saveHistory([]);
          renderHistory();
        }
        function renderHistory() {
          const list = loadHistory();
          historyCount.textContent = `(${list.length})`;
          // 移动端 tab 角标
          if (list.length > 0) {
            tabBadge.textContent = list.length > 99 ? "99+" : list.length;
            tabBadge.style.display = "inline-block";
          } else {
            tabBadge.style.display = "none";
          }
          if (list.length === 0) {
            historyList.innerHTML = "";
            emptyTip.style.display = "block";
            return;
          }
          emptyTip.style.display = "none";
          historyList.innerHTML = list.map((h) => {
            const urls = h.urls || [];
            const thumbsHtml = urls.length
              ? `<div class="history-thumbs" title="左右滑动查看更多图片">${urls
                  .map(
                    (u) =>
                      `<img src="${u}" data-full="${u}" alt="缩略图" loading="lazy" />`,
                  )
                  .join("")}</div>`
              : "";
            return `
              <li class="history-item" data-ts="${h.timestamp}" tabindex="0" role="button">
                <button class="history-delete" data-del="${h.timestamp}" title="删除" aria-label="删除此条">×</button>
                <div class="history-prompt" title="${escapeHtml(h.prompt)}">${escapeHtml(h.prompt)}</div>
                <div class="history-meta">
                  <span>${formatTime(h.timestamp)}</span>
                  <span>${urls.length} 张 · 点击图片放大</span>
                </div>
                ${thumbsHtml}
              </li>
            `;
          }).join("");
        }

        // ========== 历史点击事件 ==========
        function useHistoryEntry(ts) {
          const entry = loadHistory().find((h) => h.timestamp === ts);
          if (!entry) return;
          promptInput.value = entry.prompt;
          // 在结果区渲染该条历史的图片（无需重新请求 API）
          renderHistoryImages(entry);
          // 移动端切回主面板
          if (isMobile()) switchTab("main");
          window.scrollTo({ top: 0, behavior: "smooth" });
          promptInput.focus();
        }

        // 把历史里的图片渲染到主结果区（与"生成图片"结果样式一致）
        function renderHistoryImages(entry) {
          const urls = entry.urls || [];
          if (urls.length === 0) {
            resultDiv.innerHTML =
              '<div class="loading">📌 已加载历史提示词（此条无图片记录）</div>';
            return;
          }
          const stamp = formatTime(entry.timestamp);
          const banner = `<div class="history-banner">
            <span>📌 历史结果 · ${escapeHtml(stamp)} · 共 ${urls.length} 张</span>
            <button id="regenerateFromHistory" type="button">🔄 重新生成</button>
          </div>`;
          const useGrid = isMobile() && urls.length > 1;
          const imgsHtml = urls
            .map(
              (url) =>
                `<img src="${url}" data-full="${url}" alt="历史图片" class="result-img" loading="lazy" />`,
            )
            .join("");
          const imgsWrap = useGrid
            ? `<div class="result-grid">${imgsHtml}</div>`
            : imgsHtml;
          resultDiv.innerHTML = banner + imgsWrap;
        }
        historyList.addEventListener("click", (e) => {
          const delBtn = e.target.closest("[data-del]");
          if (delBtn) {
            e.stopPropagation();
            removeHistory(Number(delBtn.dataset.del));
            return;
          }
          const thumb = e.target.closest("img[data-full]");
          if (thumb) {
            e.stopPropagation();
            // 找到当前历史项的所有图片，从点击的那张开始展示
            const item = e.target.closest(".history-item");
            const ts = Number(item.dataset.ts);
            const entry = loadHistory().find((h) => h.timestamp === ts);
            if (entry && entry.urls && entry.urls.length) {
              const idx = entry.urls.indexOf(thumb.dataset.full);
              openLightbox(entry.urls, idx >= 0 ? idx : 0);
            } else {
              openLightbox(thumb.dataset.full);
            }
            return;
          }
          const item = e.target.closest(".history-item");
          if (item) useHistoryEntry(Number(item.dataset.ts));
        });
        // 键盘可访问
        historyList.addEventListener("keydown", (e) => {
          if (e.key === "Enter" || e.key === " ") {
            const item = e.target.closest(".history-item");
            if (item) {
              e.preventDefault();
              useHistoryEntry(Number(item.dataset.ts));
            }
          }
        });

        // ========== 灯箱（支持左右切换） ==========
        let lbList = [];      // 当前展示的图片 URL 列表
        let lbIndex = 0;      // 当前索引
        let lbTouch = { startX: 0, startY: 0, active: false };

        function openLightbox(srcOrList, startIndex = 0) {
          // 兼容两种调用：单张 url 或 url 数组
          if (Array.isArray(srcOrList)) {
            lbList = srcOrList.slice();
            lbIndex = Math.max(0, Math.min(startIndex, lbList.length - 1));
          } else {
            lbList = [srcOrList];
            lbIndex = 0;
          }
          if (lbList.length === 0) return;
          renderLightbox();
          lightbox.classList.add("active");
          document.body.style.overflow = "hidden";
          // 隐藏 hint（首次打开 3 秒后自动消失）
          if (lightboxHint) {
            lightboxHint.style.opacity = "1";
            setTimeout(() => {
              if (lightboxHint) lightboxHint.style.transition = "opacity 0.5s";
              if (lightboxHint) lightboxHint.style.opacity = "0";
            }, 2500);
          }
        }

        function closeLightbox() {
          lightbox.classList.remove("active");
          lightboxImg.src = "";
          lbList = [];
          lbIndex = 0;
          document.body.style.overflow = "";
          if (lightboxHint) {
            lightboxHint.style.opacity = "1";
            lightboxHint.style.transition = "";
          }
        }

        function renderLightbox() {
          if (lbList.length === 0) return;
          const url = lbList[lbIndex];
          lightboxImg.classList.add("loading");
          // 临时处理器：图片加载完移除 loading 态
          const onLoad = () => {
            lightboxImg.classList.remove("loading");
            lightboxImg.removeEventListener("load", onLoad);
            lightboxImg.removeEventListener("error", onLoad);
          };
          lightboxImg.addEventListener("load", onLoad);
          lightboxImg.addEventListener("error", onLoad);
          lightboxImg.src = url;
          // 计数
          lightboxCounter.textContent = `${lbIndex + 1} / ${lbList.length}`;
          // 按钮禁用（单张时）
          const single = lbList.length <= 1;
          lightboxPrev.disabled = single;
          lightboxNext.disabled = single;
          // 预加载相邻图片
          preloadImage(lbList[lbIndex + 1]);
          preloadImage(lbList[lbIndex - 1]);
        }

        function preloadImage(url) {
          if (!url) return;
          const img = new Image();
          img.src = url;
        }

        function lightboxPrevImg() {
          if (lbList.length <= 1) return;
          lbIndex = (lbIndex - 1 + lbList.length) % lbList.length;
          renderLightbox();
        }
        function lightboxNextImg() {
          if (lbList.length <= 1) return;
          lbIndex = (lbIndex + 1) % lbList.length;
          renderLightbox();
        }

        lightboxPrev.addEventListener("click", (e) => {
          e.stopPropagation();
          lightboxPrevImg();
        });
        lightboxNext.addEventListener("click", (e) => {
          e.stopPropagation();
          lightboxNextImg();
        });
        lightboxClose.addEventListener("click", (e) => {
          e.stopPropagation();
          closeLightbox();
        });
        // 点击背景关闭（点击图片不关闭）
        lightbox.addEventListener("click", (e) => {
          if (e.target === lightbox) closeLightbox();
        });

        // 键盘控制
        document.addEventListener("keydown", (e) => {
          if (!lightbox.classList.contains("active")) return;
          if (e.key === "Escape") closeLightbox();
          else if (e.key === "ArrowLeft") { e.preventDefault(); lightboxPrevImg(); }
          else if (e.key === "ArrowRight") { e.preventDefault(); lightboxNextImg(); }
        });

        // 触摸滑动支持（移动端）
        lightbox.addEventListener("touchstart", (e) => {
          if (e.touches.length !== 1) return;
          lbTouch.startX = e.touches[0].clientX;
          lbTouch.startY = e.touches[0].clientY;
          lbTouch.active = true;
        }, { passive: true });

        lightbox.addEventListener("touchend", (e) => {
          if (!lbTouch.active) return;
          lbTouch.active = false;
          const touch = e.changedTouches[0];
          const dx = touch.clientX - lbTouch.startX;
          const dy = touch.clientY - lbTouch.startY;
          // 横向滑动距离 > 40px 且 横向位移 > 纵向位移的 1.5 倍（避免误触）
          const threshold = 40;
          if (Math.abs(dx) > threshold && Math.abs(dx) > Math.abs(dy) * 1.5) {
            if (dx > 0) lightboxPrevImg();
            else lightboxNextImg();
          }
        }, { passive: true });

        // ========== Key 管理 ==========
        function updateKeyStatus(cached) {
          if (cached) {
            keyStatus.textContent = "（已缓存 ✓）";
            keyStatus.classList.remove("empty");
          } else {
            keyStatus.textContent = "（未缓存）";
            keyStatus.classList.add("empty");
          }
        }
        saveKeyBtn.addEventListener("click", () => {
          const v = apiKeyInput.value.trim();
          if (!v) { alert("Key 不能为空"); return; }
          storage.set(LS_KEY_API, v);
          updateKeyStatus(true);
          flashMessage("API Key 已保存到缓存");
        });
        clearKeyBtn.addEventListener("click", () => {
          if (!confirm("确定清除缓存中的 API Key？")) return;
          storage.remove(LS_KEY_API);
          apiKeyInput.value = "";
          updateKeyStatus(false);
        });
        toggleKeyBtn.addEventListener("click", () => {
          const isPwd = apiKeyInput.type === "password";
          apiKeyInput.type = isPwd ? "text" : "password";
          toggleKeyBtn.textContent = isPwd ? "🙈 隐藏" : "👁️ 显示";
        });
        clearCacheBtn.addEventListener("click", () => {
          if (!confirm("确定清除全部缓存吗？\n将清除：API Key、历史、上次输入的 prompt")) return;
          storage.remove(LS_KEY_API);
          storage.remove(LS_KEY_HISTORY);
          storage.remove(LS_KEY_LAST);
          apiKeyInput.value = "";
          promptInput.value = "一只可爱的柴犬戴着墨镜，在海滩上奔跑，电影质感";
          updateKeyStatus(false);
          renderHistory();
          flashMessage("已清除全部缓存");
        });
        clearHistoryBtn.addEventListener("click", clearHistory);
        exportHistoryBtn.addEventListener("click", () => {
          const list = loadHistory();
          if (list.length === 0) { alert("暂无历史可导出"); return; }
          const blob = new Blob([JSON.stringify(list, null, 2)], { type: "application/json" });
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url;
          a.download = `minimax_history_${new Date().toISOString().slice(0, 10)}.json`;
          a.click();
          URL.revokeObjectURL(url);
        });


        // ========== 一键下载全部历史图片 ==========
        // 收集所有历史图片（按时间排序，去重）
        function collectAllImageUrls() {
          const list = loadHistory();
          const seen = new Set();
          const items = []; // { url, ts, idx }
          // 按时间从旧到新排序，文件名前缀保证下载顺序可读
          const sorted = list.slice().sort((a, b) => a.timestamp - b.timestamp);
          sorted.forEach((h) => {
            (h.urls || []).forEach((u, i) => {
              if (seen.has(u)) return;
              seen.add(u);
              items.push({ url: u, ts: h.timestamp, idxInEntry: i });
            });
          });
          return items;
        }

        // 把 URL 转成 Blob（fetch 方式，跨域图可能因 CORS 失败，回退直接打开）
        async function urlToBlob(url) {
          try {
            const resp = await fetch(url, { mode: "cors", cache: "force-cache" });
            if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
            return await resp.blob();
          } catch (e) {
            // CORS 失败时直接返回 null，调用方改用 <a download> 兜底
            return null;
          }
        }

        // 触发浏览器下载（从 blob）
        function downloadBlob(blob, filename) {
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url;
          a.download = filename;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          setTimeout(() => URL.revokeObjectURL(url), 1000);
        }

        // 根据 URL 推断扩展名
        function guessExt(url) {
          const m = url.match(/\.(jpe?g|png|webp|gif|bmp)(?:\?|#|$)/i);
          if (m) return m[1].toLowerCase().replace("jpeg", "jpg");
          return "jpg";
        }

        // 格式化时间戳为文件名片段
        function tsLabel(ts) {
          const d = new Date(ts);
          const pad = (n) => String(n).padStart(2, "0");
          return `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}_${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}`;
        }

        downloadAllBtn.addEventListener("click", async () => {
          const items = collectAllImageUrls();
          if (items.length === 0) {
            alert("暂无历史图片可下载");
            return;
          }
          // 依赖检查：JSZip 来自 CDN，离线 / 被墙时会失败
          if (typeof JSZip === "undefined") {
            alert("JSZip 未加载，请检查网络（CDN 被墙时会失败）。\n可尝试切换网络后刷新页面。");
            return;
          }
          if (!confirm(`即将打包下载 ${items.length} 张历史图片为 1 个 zip 文件。\n\n继续吗？`)) {
            return;
          }

          // 锁定按钮
          downloadAllBtn.disabled = true;
          const originalText = downloadAllBtn.textContent;

          const zip = new JSZip();
          let success = 0;
          let fail = 0;
          const failed = []; // 收集失败的 URL，便于回退

          // 第一阶段：拉取所有图片并写入 zip
          for (let i = 0; i < items.length; i++) {
            const it = items[i];
            const ext = guessExt(it.url);
            const filename = `minimax_${tsLabel(it.ts)}_${i + 1}.${ext}`;
            downloadAllBtn.textContent = `⏳ 打包 ${i + 1}/${items.length}`;
            const blob = await urlToBlob(it.url);
            if (blob) {
              zip.file(filename, blob);
              success++;
            } else {
              fail++;
              failed.push(it.url);
            }
          }

          // 第二阶段：生成 zip
          if (success === 0) {
            // 一张都没拿到，直接放弃打包
            downloadAllBtn.disabled = false;
            downloadAllBtn.textContent = originalText;
            alert(`所有 ${fail} 张图片均获取失败（CORS 拦截），无法打包。`);
            return;
          }

          try {
            downloadAllBtn.textContent = `⏳ 压缩中...`;
            const zipBlob = await zip.generateAsync(
              { type: "blob", compression: "DEFLATE", compressionOptions: { level: 6 } },
              // 可选的进度回调（这里 UI 已经定住，不重复刷新）
              undefined,
            );
            const zipName = `minimax_images_${tsLabel(Date.now())}.zip`;
            downloadBlob(zipBlob, zipName);

            if (fail === 0) {
              flashMessage(`✅ 已打包 ${success} 张图片 → ${zipName}`);
            } else {
              flashMessage(`⚠️ 打包完成：${success} 成功，${fail} 张失败（CORS，已跳过）`);
              console.warn("以下图片因 CORS 跳过，未进入 zip：", failed);
            }
          } catch (e) {
            alert("压缩 zip 失败：" + e.message);
            console.error("JSZip generateAsync 失败：", e);
          } finally {
            downloadAllBtn.disabled = false;
            downloadAllBtn.textContent = originalText;
          }
        });
        // 简易 flash 消息
        function flashMessage(text) {
          const el = document.createElement("div");
          el.textContent = text;
          el.style.cssText = `
            position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
            background: #323232; color: #fff; padding: 10px 18px; border-radius: 6px;
            font-size: 14px; z-index: 10000; box-shadow: 0 2px 8px rgba(0,0,0,0.2);
            animation: fadeIn 0.2s;
          `;
          document.body.appendChild(el);
          setTimeout(() => {
            el.style.transition = "opacity 0.3s";
            el.style.opacity = "0";
            setTimeout(() => el.remove(), 300);
          }, 1500);
        }

        // ========== 核心：生成图片 ==========
        generateBtn.addEventListener("click", async () => {
          const API_KEY = apiKeyInput.value.trim();
          const prompt = promptInput.value.trim();

          if (!API_KEY) {
            resultDiv.innerHTML = '<div class="error">❌ 请先填写你的 API Key。</div>';
            return;
          }
          if (!prompt) {
            resultDiv.innerHTML = '<div class="error">❌ 请填写图片描述。</div>';
            return;
          }

          // 自动保存
          storage.set(LS_KEY_API, API_KEY);
          storage.set(LS_KEY_LAST, prompt);
          updateKeyStatus(true);

          generateBtn.disabled = true;
          const originalText = generateBtn.textContent;
          generateBtn.textContent = "⏳ 生成中...";
          resultDiv.innerHTML = '<div class="loading">⏳ 生成中，请稍候...</div>';

          try {
            const requestBody = {
              model: "image-01",
              prompt: prompt,
              aspect_ratio: "1:1",
              n: 9,
              prompt_optimizer: true,
              response_format: "base64",
            };
            const response = await fetch(API_URL, {
              method: "POST",
              headers: {
                Authorization: `Bearer ${API_KEY}`,
                "Content-Type": "application/json",
              },
              body: JSON.stringify(requestBody),
            });
            const responseText = await response.text();
            let data;
            try { data = JSON.parse(responseText); }
            catch (e) { throw new Error(`返回数据非 JSON: ${responseText}`); }
            if (!response.ok) {
              const msg = data?.base_resp?.status_msg || data?.error?.message || JSON.stringify(data);
              throw new Error(`HTTP ${response.status}: ${msg}`);
            }
            const statusCode = data?.base_resp?.status_code;
            if (statusCode && statusCode !== 0) {
              throw new Error(`业务错误 (${statusCode}): ${data?.base_resp?.status_msg || "未知错误"}`);
            }
            const urls = data?.data?.image_urls || [];
            if (urls.length === 0) {
              console.warn("完整响应数据:", data);
              throw new Error("未返回图片 URL，请检查控制台输出。");
            }
            // 渲染：移动端 2 列网格，桌面端单列
            const useGrid = isMobile() && urls.length > 1;
            if (useGrid) {
              resultDiv.innerHTML = `<div class="result-grid">${urls
                .map(
                  (url) =>
                    `<img src="${url}" data-full="${url}" alt="生成的图片" class="result-img" loading="lazy" />`,
                )
                .join("")}</div>`;
            } else {
              resultDiv.innerHTML = urls
                .map(
                  (url) =>
                    `<img src="${url}" data-full="${url}" alt="生成的图片" class="result-img" loading="lazy" />`,
                )
                .join("");
            }
            addHistory(prompt, urls);
          } catch (error) {
            resultDiv.innerHTML = `<div class="error">❌ 生成失败:<br />${error.message}</div>`;
            console.error("详细错误:", error);
          } finally {
            generateBtn.disabled = false;
            generateBtn.textContent = originalText;
          }
        });

        // 结果区图片灯箱（传入整组图片，支持左右切换）
        resultDiv.addEventListener("click", (e) => {
          // 重新生成按钮
          if (e.target.id === "regenerateFromHistory") {
            generateBtn.click();
            return;
          }
          const img = e.target.closest("img.result-img");
          if (!img) return;
          // 收集当前结果区所有图片
          const allImgs = Array.from(resultDiv.querySelectorAll("img.result-img"));
          const urls = allImgs.map((i) => i.dataset.full || i.src);
          const clicked = img.dataset.full || img.src;
          const idx = urls.indexOf(clicked);
          openLightbox(urls, idx >= 0 ? idx : 0);
        });

        // 回车触发
        promptInput.addEventListener("keydown", (e) => {
          if (e.key === "Enter") generateBtn.click();
        });
        apiKeyInput.addEventListener("keydown", (e) => {
          if (e.key === "Enter") generateBtn.click();
        });

        // ========== 初始化 ==========
        function init() {
          const cachedKey = storage.get(LS_KEY_API);
          if (cachedKey) {
            apiKeyInput.value = cachedKey;
            updateKeyStatus(true);
          } else {
            updateKeyStatus(false);
          }
          const lastPrompt = storage.get(LS_KEY_LAST);
          if (lastPrompt) promptInput.value = lastPrompt;
          renderHistory();
          // 移动端恢复 tab 状态
          if (isMobile()) {
            const savedTab = storage.get(LS_KEY_TAB, "main");
            if (savedTab === "history") switchTab("history");
          }
        }
        init();
      })();
    </script>
  </body>
</html>
