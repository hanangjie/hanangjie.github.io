<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MiniMax 文生图 - 本地测试</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
        background: #f5f5f7;
      }
      .app {
        display: flex;
        min-height: 100vh;
        max-width: 1400px;
        margin: 0 auto;
      }
      .main {
        flex: 1;
        padding: 20px 24px;
        min-width: 0;
      }
      .sidebar {
        width: 320px;
        background: #fff;
        border-left: 1px solid #e0e0e0;
        padding: 20px 16px;
        overflow-y: auto;
        max-height: 100vh;
        position: sticky;
        top: 0;
      }
      h2 {
        margin-top: 0;
      }
      input,
      button,
      textarea {
        font-family: inherit;
        font-size: 14px;
      }
      input,
      textarea {
        padding: 8px 10px;
        border: 1px solid #ccc;
        border-radius: 6px;
        outline: none;
        width: 100%;
        margin: 6px 0;
      }
      input:focus,
      textarea:focus {
        border-color: #1976d2;
      }
      button {
        padding: 10px 16px;
        font-size: 15px;
        background: #1976d2;
        color: #fff;
        border: none;
        border-radius: 6px;
        cursor: pointer;
      }
      button:hover {
        background: #1565c0;
      }
      button:disabled {
        background: #999;
        cursor: not-allowed;
      }
      .btn-row {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-top: 8px;
      }
      .btn-secondary {
        background: #f0f0f0;
        color: #333;
        border: 1px solid #ccc;
        padding: 6px 10px;
        font-size: 13px;
        border-radius: 4px;
        cursor: pointer;
      }
      .btn-secondary:hover {
        background: #e0e0e0;
      }
      #result {
        margin-top: 20px;
      }
      #result img {
        max-width: 100%;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        display: block;
        margin-bottom: 12px;
        background: #fff;
      }
      .error {
        color: #c62828;
        white-space: pre-wrap;
        word-break: break-all;
        background: #ffebee;
        padding: 10px;
        border-radius: 6px;
      }
      .loading {
        color: #555;
        background: #fff8e1;
        padding: 10px;
        border-radius: 6px;
      }
      .warning {
        color: #d32f2f;
        font-weight: bold;
        background: #fff3e0;
        padding: 10px;
        border-radius: 6px;
        border-left: 4px solid #d32f2f;
      }
      .field {
        margin-bottom: 12px;
      }
      .field label {
        font-weight: bold;
        font-size: 14px;
        color: #333;
      }
      .key-status {
        font-size: 12px;
        color: #2e7d32;
        margin-left: 8px;
      }
      .key-status.empty {
        color: #c62828;
      }
      /* 历史侧边栏 */
      .sidebar h3 {
        margin: 0 0 12px 0;
        font-size: 16px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .history-list {
        list-style: none;
        padding: 0;
        margin: 0;
      }
      .history-item {
        background: #fafafa;
        border: 1px solid #e0e0e0;
        border-radius: 6px;
        padding: 10px;
        margin-bottom: 8px;
        cursor: pointer;
        transition: all 0.15s;
        position: relative;
      }
      .history-item:hover {
        background: #e3f2fd;
        border-color: #1976d2;
      }
      .history-prompt {
        font-size: 13px;
        color: #333;
        line-height: 1.4;
        display: -webkit-box;
        -webkit-line-clamp: 3;
        line-clamp: 3;
        -webkit-box-orient: vertical;
        overflow: hidden;
        word-break: break-all;
        margin-bottom: 6px;
      }
      .history-meta {
        font-size: 11px;
        color: #888;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .history-thumbs {
        display: flex;
        gap: 4px;
        margin-top: 6px;
      }
      .history-thumbs img {
        width: 48px;
        height: 48px;
        object-fit: cover;
        border-radius: 4px;
        background: #eee;
        cursor: zoom-in;
        border: 1px solid #ddd;
      }
      .history-delete {
        position: absolute;
        top: 6px;
        right: 6px;
        background: transparent;
        color: #999;
        border: none;
        cursor: pointer;
        font-size: 14px;
        padding: 2px 6px;
        line-height: 1;
      }
      .history-delete:hover {
        color: #c62828;
        background: transparent;
      }
      .empty-tip {
        text-align: center;
        color: #999;
        font-size: 13px;
        padding: 20px 0;
      }
      .sidebar-actions {
        display: flex;
        gap: 6px;
        margin-bottom: 12px;
      }
      .sidebar-actions button {
        flex: 1;
        padding: 6px 8px;
        font-size: 12px;
        background: #fff;
        color: #555;
        border: 1px solid #ccc;
      }
      .sidebar-actions button:hover {
        background: #f5f5f5;
        color: #c62828;
        border-color: #c62828;
      }
      /* 图片灯箱 */
      .lightbox {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.85);
        z-index: 9999;
        align-items: center;
        justify-content: center;
        cursor: zoom-out;
      }
      .lightbox.active {
        display: flex;
      }
      .lightbox img {
        max-width: 90vw;
        max-height: 90vh;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
      }
    </style>
  </head>
  <body>
    <div class="app">
      <!-- 左侧：主操作区 -->
      <div class="main">
        <h2>🎨 MiniMax 文生图 (前端直调)</h2>
        <div class="warning">
          ⚠️ 警告：API Key 会暴露在前端，仅限本地测试使用，切勿用于生产环境！
        </div>

        <div class="field" style="margin-top: 16px;">
          <label
            >🔑 API Key
            <span id="keyStatus" class="key-status empty">（未缓存）</span></label
          >
          <input
            id="apiKeyInput"
            placeholder="请输入你的 API Key (会自动缓存到 localStorage)"
            autocomplete="off"
          />
          <div class="btn-row" style="margin-top: 4px;">
            <button class="btn-secondary" id="saveKeyBtn">💾 保存 Key 到缓存</button>
            <button class="btn-secondary" id="clearKeyBtn">🗑️ 清除 Key 缓存</button>
          </div>
        </div>

        <div class="field">
          <label>📝 图片描述 (Prompt):</label>
          <input
            id="promptInput"
            type="text"
            value="一只可爱的柴犬戴着墨镜，在海滩上奔跑，电影质感"
            placeholder="输入提示词，回车或点击生成"
          />
        </div>

        <div class="btn-row">
          <button id="generateBtn">🚀 生成图片</button>
          <button class="btn-secondary" id="clearCacheBtn">🗑️ 清除全部缓存</button>
        </div>

        <div id="result"></div>
      </div>

      <!-- 右侧：历史侧边栏 -->
      <aside class="sidebar">
        <h3>
          📜 历史提示词
          <span style="font-size: 12px; color: #888; font-weight: normal"
            >(<span id="historyCount">0</span>)</span
          >
        </h3>
        <div class="sidebar-actions">
          <button id="exportHistoryBtn">📥 导出 JSON</button>
          <button id="clearHistoryBtn">🗑️ 清空历史</button>
        </div>
        <ul id="historyList" class="history-list"></ul>
        <div id="emptyTip" class="empty-tip">暂无历史，生成后会自动保存</div>
      </aside>
    </div>

    <!-- 图片灯箱 -->
    <div id="lightbox" class="lightbox">
      <img id="lightboxImg" src="" alt="预览" />
    </div>

    <script>
      (function () {
        const API_URL = "https://api.minimaxi.com/v1/image_generation";
        const LS_KEY_API = "minimax_api_key";
        const LS_KEY_HISTORY = "minimax_prompt_history";
        const LS_KEY_LAST = "minimax_last_prompt";
        const HISTORY_MAX = 50; // 最多保留的历史条数

        // ========== 工具：localStorage 封装（带 try/catch 防隐私模式） ==========
        const storage = {
          get(key, fallback = null) {
            try {
              const v = localStorage.getItem(key);
              return v === null ? fallback : v;
            } catch (e) {
              console.warn("localStorage 读取失败:", e);
              return fallback;
            }
          },
          set(key, value) {
            try {
              localStorage.setItem(key, value);
              return true;
            } catch (e) {
              console.warn("localStorage 写入失败:", e);
              return false;
            }
          },
          remove(key) {
            try {
              localStorage.removeItem(key);
              return true;
            } catch (e) {
              console.warn("localStorage 删除失败:", e);
              return false;
            }
          },
        };

        // ========== DOM 引用 ==========
        const generateBtn = document.getElementById("generateBtn");
        const resultDiv = document.getElementById("result");
        const apiKeyInput = document.getElementById("apiKeyInput");
        const promptInput = document.getElementById("promptInput");
        const saveKeyBtn = document.getElementById("saveKeyBtn");
        const clearKeyBtn = document.getElementById("clearKeyBtn");
        const clearCacheBtn = document.getElementById("clearCacheBtn");
        const historyList = document.getElementById("historyList");
        const historyCount = document.getElementById("historyCount");
        const emptyTip = document.getElementById("emptyTip");
        const clearHistoryBtn = document.getElementById("clearHistoryBtn");
        const exportHistoryBtn = document.getElementById("exportHistoryBtn");
        const keyStatus = document.getElementById("keyStatus");
        const lightbox = document.getElementById("lightbox");
        const lightboxImg = document.getElementById("lightboxImg");

        // ========== 初始化：从缓存恢复 ==========
        function init() {
          // 1) 优先使用缓存的 Key
          const cachedKey = storage.get(LS_KEY_API);
          if (cachedKey) {
            apiKeyInput.value = cachedKey;
            keyStatus.textContent = "（已从缓存加载 ✓）";
            keyStatus.classList.remove("empty");
          } else {
            keyStatus.textContent = "（未缓存）";
            keyStatus.classList.add("empty");
          }

          // 2) 恢复上次的 prompt（可选，提升体验）
          const lastPrompt = storage.get(LS_KEY_LAST);
          if (lastPrompt) {
            promptInput.value = lastPrompt;
          }

          // 3) 渲染历史
          renderHistory();
        }

        // ========== 历史管理 ==========
        function loadHistory() {
          try {
            const raw = storage.get(LS_KEY_HISTORY, "[]");
            const arr = JSON.parse(raw);
            return Array.isArray(arr) ? arr : [];
          } catch (e) {
            console.warn("历史数据解析失败，重置为空:", e);
            return [];
          }
        }

        function saveHistory(list) {
          storage.set(LS_KEY_HISTORY, JSON.stringify(list));
        }

        function addHistory(prompt, imageUrls) {
          const list = loadHistory();
          // 去重：如果已存在相同 prompt，更新到顶部并合并图片
          const existingIdx = list.findIndex((h) => h.prompt === prompt);
          const now = Date.now();
          let entry;
          if (existingIdx >= 0) {
            entry = list[existingIdx];
            entry.timestamp = now;
            // 合并新 URL（去重）
            const set = new Set([...(entry.urls || []), ...imageUrls]);
            entry.urls = Array.from(set);
            list.splice(existingIdx, 1);
          } else {
            entry = {
              prompt,
              urls: imageUrls,
              timestamp: now,
            };
          }
          list.unshift(entry);
          // 限制条数
          if (list.length > HISTORY_MAX) {
            list.length = HISTORY_MAX;
          }
          saveHistory(list);
          renderHistory();
        }

        function removeHistory(timestamp) {
          const list = loadHistory().filter((h) => h.timestamp !== timestamp);
          saveHistory(list);
          renderHistory();
        }

        function clearHistory() {
          if (!confirm("确定清空所有历史提示词吗？此操作不可恢复。")) return;
          saveHistory([]);
          renderHistory();
        }

        function formatTime(ts) {
          const d = new Date(ts);
          const pad = (n) => String(n).padStart(2, "0");
          return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(
            d.getDate(),
          )} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
        }

        function renderHistory() {
          const list = loadHistory();
          historyCount.textContent = list.length;
          if (list.length === 0) {
            historyList.innerHTML = "";
            emptyTip.style.display = "block";
            return;
          }
          emptyTip.style.display = "none";
          historyList.innerHTML = list
            .map(
              (h) => `
                <li class="history-item" data-ts="${h.timestamp}">
                  <button class="history-delete" data-del="${h.timestamp}" title="删除此条">×</button>
                  <div class="history-prompt" title="${escapeHtml(h.prompt)}">${escapeHtml(
                h.prompt,
              )}</div>
                  <div class="history-meta">
                    <span>${formatTime(h.timestamp)}</span>
                    <span>${(h.urls || []).length} 张</span>
                  </div>
                  ${
                    h.urls && h.urls.length
                      ? `<div class="history-thumbs">${h.urls
                          .slice(0, 4)
                          .map(
                            (u) =>
                              `<img src="${u}" data-full="${u}" alt="缩略图" loading="lazy" />`,
                          )
                          .join("")}${
                          h.urls.length > 4
                            ? `<span style="font-size:11px;color:#888;align-self:center;">+${
                                h.urls.length - 4
                              }</span>`
                            : ""
                        }</div>`
                      : ""
                  }
                </li>
              `,
            )
            .join("");
        }

        function escapeHtml(s) {
          return String(s)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#39;");
        }

        // 历史项点击：填入 prompt 并滚动到顶部
        historyList.addEventListener("click", (e) => {
          // 删除按钮
          const delBtn = e.target.closest("[data-del]");
          if (delBtn) {
            e.stopPropagation();
            const ts = Number(delBtn.dataset.del);
            removeHistory(ts);
            return;
          }
          // 缩略图点击：开灯箱
          const thumb = e.target.closest("img[data-full]");
          if (thumb) {
            e.stopPropagation();
            lightboxImg.src = thumb.dataset.full;
            lightbox.classList.add("active");
            return;
          }
          // 整条点击：填入 prompt
          const item = e.target.closest(".history-item");
          if (item) {
            const ts = Number(item.dataset.ts);
            const entry = loadHistory().find((h) => h.timestamp === ts);
            if (entry) {
              promptInput.value = entry.prompt;
              promptInput.focus();
              window.scrollTo({ top: 0, behavior: "smooth" });
            }
          }
        });

        // 灯箱点击关闭
        lightbox.addEventListener("click", () => {
          lightbox.classList.remove("active");
          lightboxImg.src = "";
        });

        // ========== Key 管理按钮 ==========
        saveKeyBtn.addEventListener("click", () => {
          const v = apiKeyInput.value.trim();
          if (!v) {
            alert("Key 不能为空");
            return;
          }
          storage.set(LS_KEY_API, v);
          keyStatus.textContent = "（已保存到缓存 ✓）";
          keyStatus.classList.remove("empty");
          alert("API Key 已保存到 localStorage，下次打开会自动填充。");
        });

        clearKeyBtn.addEventListener("click", () => {
          if (!confirm("确定清除缓存中的 API Key？")) return;
          storage.remove(LS_KEY_API);
          apiKeyInput.value = "";
          keyStatus.textContent = "（未缓存）";
          keyStatus.classList.add("empty");
        });

        clearCacheBtn.addEventListener("click", () => {
          if (
            !confirm(
              "确定清除全部缓存吗？\n\n将清除：\n- API Key\n- 历史提示词\n- 上次输入的 prompt",
            )
          )
            return;
          storage.remove(LS_KEY_API);
          storage.remove(LS_KEY_HISTORY);
          storage.remove(LS_KEY_LAST);
          apiKeyInput.value = "";
          promptInput.value =
            "一只可爱的柴犬戴着墨镜，在海滩上奔跑，电影质感";
          keyStatus.textContent = "（未缓存）";
          keyStatus.classList.add("empty");
          renderHistory();
          alert("已清除全部缓存。");
        });

        clearHistoryBtn.addEventListener("click", clearHistory);

        exportHistoryBtn.addEventListener("click", () => {
          const list = loadHistory();
          if (list.length === 0) {
            alert("暂无历史可导出");
            return;
          }
          const blob = new Blob([JSON.stringify(list, null, 2)], {
            type: "application/json",
          });
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url;
          a.download = `minimax_history_${new Date()
            .toISOString()
            .slice(0, 10)}.json`;
          a.click();
          URL.revokeObjectURL(url);
        });

        // ========== 核心：生成图片 ==========
        generateBtn.addEventListener("click", async () => {
          const API_KEY = apiKeyInput.value.trim();
          const prompt = promptInput.value.trim();

          if (!API_KEY) {
            resultDiv.innerHTML =
              '<div class="error">❌ 请先填写你的 API Key。</div>';
            return;
          }
          if (!prompt) {
            resultDiv.innerHTML =
              '<div class="error">❌ 请填写图片描述。</div>';
            return;
          }

          // 顺手把当前 Key 和 prompt 也存一下（无需手动点保存）
          storage.set(LS_KEY_API, API_KEY);
          storage.set(LS_KEY_LAST, prompt);
          keyStatus.textContent = "（已从缓存加载 ✓）";
          keyStatus.classList.remove("empty");

          // 锁定按钮
          generateBtn.disabled = true;
          generateBtn.textContent = "⏳ 生成中...";
          resultDiv.innerHTML = '<div class="loading">⏳ 生成中，请稍候...</div>';

          try {
            const requestBody = {
              model: "image-01",
              prompt: prompt,
              aspect_ratio: "1:1",
              n: 9,
              prompt_optimizer: true,
              response_format: "url",
            };

            const response = await fetch(API_URL, {
              method: "POST",
              headers: {
                Authorization: `Bearer ${API_KEY}`,
                "Content-Type": "application/json",
              },
              body: JSON.stringify(requestBody),
            });

            const responseText = await response.text();
            let data;
            try {
              data = JSON.parse(responseText);
            } catch (e) {
              throw new Error(`返回数据非 JSON: ${responseText}`);
            }

            if (!response.ok) {
              const msg =
                data?.base_resp?.status_msg ||
                data?.error?.message ||
                JSON.stringify(data);
              throw new Error(`HTTP ${response.status}: ${msg}`);
            }

            const statusCode = data?.base_resp?.status_code;
            if (statusCode && statusCode !== 0) {
              const msg = data?.base_resp?.status_msg || "未知业务错误";
              throw new Error(`业务错误 (${statusCode}): ${msg}`);
            }

            const urls = data?.data?.image_urls || [];
            if (urls.length === 0) {
              console.warn("完整响应数据:", data);
              throw new Error("未返回图片 URL，请检查控制台输出。");
            }

            // 渲染图片（带灯箱支持）
            resultDiv.innerHTML = urls
              .map(
                (url) =>
                  `<div style="margin-bottom: 12px;"><img src="${url}" data-full="${url}" alt="生成的图片" class="result-img" style="cursor: zoom-in;" /></div>`,
              )
              .join("");

            // ★ 保存到历史（含图片 URL）
            addHistory(prompt, urls);
          } catch (error) {
            resultDiv.innerHTML = `<div class="error">❌ 生成失败:<br />${error.message}</div>`;
            console.error("详细错误:", error);
          } finally {
            generateBtn.disabled = false;
            generateBtn.textContent = "🚀 生成图片";
          }
        });

        // 结果区图片点击 → 灯箱
        resultDiv.addEventListener("click", (e) => {
          const img = e.target.closest("img.result-img");
          if (img) {
            lightboxImg.src = img.dataset.full || img.src;
            lightbox.classList.add("active");
          }
        });

        // 回车触发
        promptInput.addEventListener("keydown", (e) => {
          if (e.key === "Enter") generateBtn.click();
        });
        apiKeyInput.addEventListener("keydown", (e) => {
          if (e.key === "Enter") generateBtn.click();
        });

        // 启动
        init();
      })();
    </script>
  </body>
</html>
